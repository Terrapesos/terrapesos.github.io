                            {e.label}
                          </div>
                        )}
                      </div>
                      {tpEditing ? (
                        <input className="pf-tp-edit-input price" value={e.price} onChange={(ev) => tpUpdateStudent(cursoActivo.id, e._i, "price", ev.target.value)} />
                      ) : (
                        <div className="pf-tp-price">{e.price}</div>
                      )}
                      {tpEditing && (
                        <>
                          <button className="pf-tp-adjust minus" title="Restar" onClick={() => tpAjustar(cursoActivo, e.label, -tpMontoNum())}>−</button>
                          <button className="pf-tp-adjust plus" title="Sumar" onClick={() => tpAjustar(cursoActivo, e.label, tpMontoNum())}>+</button>
                        </>
                      )}
                      {tpEditing && <button className="pf-tp-remove" onClick={() => tpRemoveStudent(cursoActivo.id, e._i)}>×</button>}
                    </div>
                  ))}
                  {tpEditing && <button className="pf-tp-add-row" onClick={() => tpAddStudent(cursoActivo.id)}><Plus size={13} style={{ verticalAlign: -2 }} /> Agregar estudiante</button>}
                </>
              )}
            </>
          );
        })()}

        {tpTab === "movimientos" && (
          <>
            <div className="pf-tp-col-title">Últimos movimientos</div>
            <div className="pf-tp-col-desc">Cada vez que un profesor suma o resta terrapesos queda registrado aquí.</div>
            {tpMovs === null && <p className="pf-muted" style={{ fontSize: 13 }}>Cargando…</p>}
            {tpMovs && tpMovs.length === 0 && <p className="pf-muted" style={{ fontSize: 13.5 }}>Todavía no hay movimientos registrados.</p>}
            {(tpMovs || []).map((m, i) => (
              <div className="pf-tp-item" key={i}>
                <div className="pf-tp-body">
                  <div className="pf-tp-label">{m.nombre} <span className="pf-muted" style={{ fontSize: 12 }}>· {m.curso}</span></div>
                  <div className="pf-tp-note">{new Date(m.t).toLocaleString("es-CL", { dateStyle: "short", timeStyle: "short" })}{m.motivo ? " · " + m.motivo : ""}</div>
                </div>
                <div className="pf-tp-price" style={{ color: m.delta < 0 ? "#FB7185" : "#4ADE80" }}>{m.delta > 0 ? "+" : ""}{m.delta.toLocaleString("es-CL")}</div>
              </div>
            ))}
          </>
        )}

        {!tpLoaded && <p className="pf-muted" style={{ marginTop: 18, fontSize: 12.5 }}>Cargando valores guardados…</p>}

        {tpAskingPin && (
          <div className="pf-search-overlay" onClick={() => setTpAskingPin(false)}>
            <div className="pf-search-panel" style={{ maxWidth: 380 }} onClick={(e) => e.stopPropagation()}>
              <div style={{ padding: "22px 22px 6px" }}>
                <h3 className="pf-serif" style={{ fontSize: 18, margin: "0 0 6px" }}>Modo edición · Terrapesos</h3>
                <p className="pf-muted" style={{ fontSize: 13, margin: "0 0 16px" }}>Ingresa la clave del profesor o profesora para editar los valores.</p>
                <input
                  autoFocus
                  type="password"
                  className="pf-input"
                  style={{ width: "100%", marginBottom: 8 }}
                  placeholder="Clave"
                  value={tpPinInput}
                  onChange={(e) => { setTpPinInput(e.target.value); setTpPinError(false); }}
                  onKeyDown={(e) => e.key === "Enter" && tpConfirmPin()}
                />
                {tpPinError && <p style={{ color: "#FB7185", fontSize: 12.5, margin: "0 0 10px" }}>Clave incorrecta. Intenta nuevamente.</p>}
              </div>
              <div style={{ display: "flex", gap: 10, padding: "10px 22px 22px" }}>
                <button className="pf-btn pf-btn-primary" onClick={tpConfirmPin}>Entrar</button>
                <button className="pf-btn pf-btn-secondary" onClick={() => setTpAskingPin(false)}>Cancelar</button>
              </div>
            </div>
          </div>
        )}
      </div>
    );
  };
  return (
    <div className="pf-app">
      <style>{STYLES}</style>
      <div style={{ position: "relative", zIndex: 1 }}>
        <header className="pf-nav">
          <div className="pf-container pf-nav-inner">
            <div className="pf-logo" style={{ cursor: "default" }}>
              <div className="pf-logo-mark" style={{ fontSize: 26 }}>🪙</div>
              <div className="pf-logo-text">
                <div className="pf-logo-name">Terrapesos</div>
                <div className="pf-logo-sub">El monedero de la clase</div>
              </div>
            </div>
          </div>
        </header>
        {renderTerrapesos()}
        {toast && (
          <div className="pf-tp-toast">{toast}<button onClick={() => setToast(null)}>✕</button></div>
        )}
        <footer className="pf-footer pf-container">Terrapesos · Sistema de incentivos para todas las asignaturas</footer>
      </div>
    </div>
  );
}

createRoot(document.getElementById("root")).render(<TerrapesosApp />);
</script>
</body>
</html>
