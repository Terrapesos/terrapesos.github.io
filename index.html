/* ------------------------------------------------------------
   Sustituto de window.storage (solo disponible dentro de
   claude.ai) conectado a Firebase (Cloud Firestore) para los
   datos compartidos entre todos los estudiantes (Terrapesos,
   Pregunta del día). Los datos personales (mejores puntajes de
   juegos, progreso diario de la Palabra del día) siguen
   guardándose en localStorage, en el propio navegador.
   ------------------------------------------------------------ */
const firebaseConfig = {
  apiKey: "AIzaSyD6QGZ8-0kTadVXxEPavR0fUm_8XD1vqEQ",
  authDomain: "deusivenatura-b042b.firebaseapp.com",
  projectId: "deusivenatura-b042b",
  storageBucket: "deusivenatura-b042b.firebasestorage.app",
  messagingSenderId: "854823557109",
  appId: "1:854823557109:web:68b241193ead69a55572bc",
};
const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);

if (!window.storage) {
  window.storage = {
    async get(key, shared) {
      if (shared) {
        const snap = await getDoc(doc(db, "shared", key));
        if (!snap.exists()) throw new Error("not found");
        return { key, value: snap.data().value, shared };
      }
      const raw = localStorage.getItem(key);
      if (raw === null) throw new Error("not found");
      return { key, value: raw, shared };
    },
    async set(key, value, shared) {
      if (shared) {
        await setDoc(doc(db, "shared", key), { value });
        return { key, value, shared };
      }
      localStorage.setItem(key, value);
      return { key, value, shared };
    },
    async delete(key, shared) {
      if (shared) {
        await deleteDoc(doc(db, "shared", key));
        return { key, deleted: true, shared };
      }
      localStorage.removeItem(key);
      return { key, deleted: true, shared };
    },
    async list(prefix, shared) {
      if (shared) {
        const snap = await getDocs(collection(db, "shared"));
        const keys = snap.docs.map((d) => d.id).filter((k) => !prefix || k.startsWith(prefix));
        return { keys, prefix, shared };
      }
      const keys = Object.keys(localStorage).filter((k) => !prefix || k.startsWith(prefix));
      return { keys, prefix, shared };
    },
  };
}

const STYLES = `
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');

.pf-app {
  --ink: #14151F;
  --ink-2: #21243A;
  --ink-3: #2C2F4A;
  --border: #40456B;
  --paper: #EDE6D6;
  --gold: #F5A100;
  --gold-soft: #FFC93C;
  --teal: #2DD4BF;
  --violet: #A78BFA;
  --coral: #FF6B6B;
  --success: #4ADE80;
  --danger: #FB7185;
  --text: #F8F6F0;
  --text-muted: #B7B9D6;
  font-family: 'IBM Plex Sans', sans-serif;
  background:
    radial-gradient(650px circle at 12% 8%, rgba(255,201,60,0.09), transparent 60%),
    radial-gradient(600px circle at 88% 18%, rgba(45,212,191,0.09), transparent 60%),
    radial-gradient(650px circle at 25% 92%, rgba(167,139,250,0.08), transparent 60%),
    radial-gradient(550px circle at 92% 85%, rgba(255,107,107,0.07), transparent 60%),
    var(--ink);
  background-attachment: fixed;
  color: var(--text);
  min-height: 100vh;
  line-height: 1.5;
}
.pf-app * { box-sizing: border-box; }
.pf-serif { font-family: 'Fraunces', serif; }
.pf-container { max-width: 1120px; margin: 0 auto; padding: 0 24px; }

/* NAV */
.pf-nav { position: sticky; top: 0; z-index: 40; background: rgba(20,21,31,0.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
.pf-nav-inner { display: flex; align-items: center; justify-content: space-between; height: 68px; }
.pf-logo { display: flex; align-items: center; gap: 10px; cursor: pointer; background: none; border: none; }
.pf-logo-mark { width: 34px; height: 34px; border-radius: 8px; overflow: hidden; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
.pf-logo-mark img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 35%; display: block; }
.pf-logo-text { text-align: left; }
.pf-logo-name { font-family: 'Fraunces', serif; font-size: 19px; font-weight: 600; letter-spacing: 0.2px; color: var(--text); }
.pf-logo-sub { font-size: 11.5px; color: var(--text-muted); margin-top: -2px; }
.pf-nav-links { display: none; gap: 4px; }
.pf-nav-link { display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 7px; border: none; background: none; color: var(--text-muted); font-size: 14px; cursor: pointer; font-family: inherit; white-space: nowrap; transition: color .15s, background .15s; }
.pf-nav-link:hover { color: var(--text); background: var(--ink-3); }
.pf-nav-link.active { color: var(--ink); background: var(--gold-soft); font-weight: 600; }
.pf-nav-right { display: flex; align-items: center; gap: 8px; }
.pf-search-btn { display: flex; align-items: center; gap: 8px; border: 1px solid var(--border); background: var(--ink-2); color: var(--text-muted); padding: 7px 12px; border-radius: 8px; cursor: pointer; font-size: 13.5px; font-family: inherit; }
.pf-search-btn:hover { border-color: var(--gold); color: var(--text); }
.pf-menu-btn { display: flex; background: none; border: none; color: var(--text); cursor: pointer; padding: 6px; }
@media (min-width: 900px) {
  .pf-nav-links { display: flex; }
  .pf-menu-btn { display: none; }
}
.pf-mobile-menu { border-top: 1px solid var(--border); background: var(--ink-2); }
.pf-mobile-menu .pf-nav-link { width: 100%; justify-content: flex-start; padding: 13px 24px; border-radius: 0; }

/* SEARCH OVERLAY */
.pf-search-overlay { position: fixed; inset: 0; background: rgba(10,10,16,0.72); z-index: 60; display: flex; align-items: flex-start; justify-content: center; padding: 80px 20px; }
.pf-search-panel { background: var(--ink-2); border: 1px solid var(--border); border-radius: 14px; width: 100%; max-width: 640px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
.pf-search-input-row { display: flex; align-items: center; gap: 10px; padding: 16px 18px; border-bottom: 1px solid var(--border); }
.pf-search-input-row input { flex: 1; background: none; border: none; outline: none; color: var(--text); font-size: 16px; font-family: inherit; }
.pf-search-input-row input::placeholder { color: var(--text-muted); }

/* HERO */
.pf-hero { padding: 64px 0 56px; }
.pf-eyebrow { display: inline-flex; align-items: center; gap: 8px; color: var(--gold-soft); font-size: 13.5px; margin-bottom: 18px; }
.pf-hero h1 { font-family: 'Fraunces', serif; font-weight: 600; font-size: clamp(32px, 5vw, 52px); line-height: 1.08; max-width: 780px; margin: 0 0 20px; letter-spacing: -0.5px; }
.pf-hero p.pf-lede { font-size: 17px; color: var(--text-muted); max-width: 560px; margin: 0 0 30px; }
.pf-btn-row { display: flex; gap: 12px; flex-wrap: wrap; }
.pf-btn { font-family: inherit; font-size: 14.5px; font-weight: 600; padding: 12px 20px; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; border: 1px solid transparent; transition: transform .12s, filter .12s, box-shadow .2s ease; }
.pf-btn:hover { filter: brightness(1.08); }
.pf-btn:active { transform: translateY(1px); }
.pf-btn-primary { background: var(--gold-soft); color: var(--ink); box-shadow: 0 0 18px rgba(255,201,60,0.35), 0 4px 14px rgba(0,0,0,0.25); }
.pf-btn-secondary { background: none; border-color: var(--border); color: var(--text); }
.pf-btn-secondary:hover { border-color: var(--gold); box-shadow: 0 0 14px rgba(245,161,0,0.25); }

/* SECTION */
.pf-section { padding: 56px 0; border-bottom: 1px solid var(--border); }
.pf-section:last-child { border-bottom: none; }
.pf-section-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 28px; gap: 16px; flex-wrap: wrap; }
.pf-section-head h2 { font-family: 'Fraunces', serif; font-size: 27px; font-weight: 600; margin: 0; }
.pf-section-head p { color: var(--text-muted); font-size: 14.5px; margin: 6px 0 0; }
.pf-link-more { color: var(--gold-soft); font-size: 13.5px; display: flex; align-items: center; gap: 4px; background: none; border: none; cursor: pointer; font-family: inherit; white-space: nowrap; }

/* GRID + CARDS */
.pf-grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
.pf-grid-2 { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.pf-card { background: var(--ink-2); border: 1px solid var(--border); border-radius: 12px; padding: 20px; cursor: pointer; text-align: left; transition: border-color .15s, transform .15s; font-family: inherit; color: var(--text); }
.pf-card:hover { border-color: var(--gold); transform: translateY(-2px); }
.pf-card.disabled { opacity: 0.55; cursor: default; }
.pf-card.disabled:hover { border-color: var(--border); transform: none; }
.pf-card h3 { font-family: 'Fraunces', serif; font-size: 17.5px; font-weight: 600; margin: 0 0 6px; }
.pf-card p { font-size: 13.5px; color: var(--text-muted); margin: 0; }
.pf-tag { display: inline-block; font-size: 11px; padding: 3px 9px; border-radius: 20px; background: var(--ink-3); color: var(--gold-soft); border: 1px solid var(--border); margin-bottom: 10px; letter-spacing: 0.2px; }
.pf-tag.teal { color: var(--teal); }

/* TABS */
.pf-tabs { display: flex; gap: 8px; margin-bottom: 24px; border-bottom: 1px solid var(--border); }
.pf-tab { background: none; border: none; color: var(--text-muted); padding: 10px 4px; margin-right: 22px; font-size: 15px; font-family: inherit; cursor: pointer; border-bottom: 2px solid transparent; }
.pf-tab.active { color: var(--text); border-color: var(--gold); font-weight: 600; }

/* BREADCRUMB */
.pf-breadcrumb { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; font-size: 13px; color: var(--text-muted); margin-bottom: 22px; }
.pf-breadcrumb button { background: none; border: none; color: var(--text-muted); cursor: pointer; font-family: inherit; font-size: 13px; padding: 2px 0; }
.pf-breadcrumb button:hover { color: var(--gold-soft); }
.pf-breadcrumb .current { color: var(--text); }

/* PROCESS DIAGRAM */
.pf-process { display: flex; align-items: stretch; gap: 0; overflow-x: auto; padding-bottom: 4px; }
.pf-process-step { flex: 1; min-width: 150px; background: var(--ink-2); border: 1px solid var(--border); padding: 18px 16px; position: relative; }
.pf-process-step:first-child { border-radius: 10px 0 0 10px; }
.pf-process-step:last-child { border-radius: 0 10px 10px 0; }
.pf-process-step + .pf-process-step { border-left: none; }
.pf-process-num { font-family: 'Fraunces', serif; font-size: 13px; color: var(--gold-soft); margin-bottom: 8px; }
.pf-process-step h4 { margin: 0 0 4px; font-size: 14.5px; font-weight: 600; }
.pf-process-step p { margin: 0; font-size: 12.5px; color: var(--text-muted); }

/* TOPIC DETAIL */
.pf-topic-block { margin-bottom: 30px; }
.pf-topic-block h3 { font-family: 'Fraunces', serif; font-size: 18px; margin: 0 0 10px; }
.pf-topic-block p, .pf-topic-block li { font-size: 14.5px; color: var(--text-muted); line-height: 1.65; }
.pf-chip-row { display: flex; gap: 8px; flex-wrap: wrap; }
.pf-chip { font-size: 12.5px; padding: 5px 12px; border-radius: 20px; background: var(--ink-3); border: 1px solid var(--border); color: var(--text); }
.pf-resource-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--ink-2); border: 1px solid var(--border); border-radius: 9px; margin-bottom: 8px; }
.pf-resource-row .ico { color: var(--gold-soft); flex-shrink: 0; }
.pf-resource-row .meta { font-size: 12px; color: var(--text-muted); }

/* FILTER BAR */
.pf-filter-bar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 26px; align-items: center; }
.pf-select, .pf-input { background: var(--ink-2); border: 1px solid var(--border); color: var(--text); padding: 9px 12px; border-radius: 8px; font-size: 13.5px; font-family: inherit; }
.pf-input { flex: 1; min-width: 200px; }

/* FLASHCARD */
.pf-flashcard-wrap { display: flex; flex-direction: column; align-items: center; gap: 20px; padding: 20px 0 10px; }
.pf-flashcard { width: 100%; max-width: 520px; min-height: 220px; background: var(--ink-2); border: 1px solid var(--border); border-radius: 16px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 32px; cursor: pointer; position: relative; }
.pf-flashcard:hover { border-color: var(--gold); }
.pf-flashcard .face-label { position: absolute; top: 16px; left: 20px; font-size: 11px; letter-spacing: 0.5px; color: var(--gold-soft); }
.pf-flashcard .txt { font-family: 'Fraunces', serif; font-size: 19px; line-height: 1.5; }
.pf-flashcard.back .txt { font-family: 'IBM Plex Sans', sans-serif; font-size: 15.5px; color: var(--text-muted); }
.pf-flash-controls { display: flex; align-items: center; gap: 16px; }
.pf-icon-btn { background: var(--ink-2); border: 1px solid var(--border); color: var(--text); width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.pf-icon-btn:hover { border-color: var(--gold); }
.pf-flash-counter { font-size: 13px; color: var(--text-muted); min-width: 56px; text-align: center; }

/* QUIZ */
.pf-quiz-q { font-family: 'Fraunces', serif; font-size: 17.5px; margin: 0 0 16px; }
.pf-quiz-opt { display: block; width: 100%; text-align: left; background: var(--ink-2); border: 1px solid var(--border); color: var(--text); padding: 12px 14px; border-radius: 9px; margin-bottom: 9px; cursor: pointer; font-family: inherit; font-size: 14px; }
.pf-quiz-opt:hover { border-color: var(--gold); }
.pf-quiz-opt.correct { border-color: var(--success); background: rgba(74,222,128,0.14); }
.pf-quiz-opt.incorrect { border-color: var(--danger); background: rgba(251,113,133,0.14); }
.pf-quiz-fb { display: flex; gap: 10px; align-items: flex-start; padding: 14px; border-radius: 9px; background: var(--ink-3); margin-top: 12px; font-size: 13.5px; color: var(--text-muted); }

/* AUTHOR */
.pf-author-hero { display: flex; align-items: flex-end; gap: 18px; margin-bottom: 30px; }
.pf-author-avatar { width: 64px; height: 64px; border-radius: 50%; background: linear-gradient(155deg, var(--teal), var(--ink-3)); display: flex; align-items: center; justify-content: center; font-family: 'Fraunces', serif; font-size: 24px; color: var(--text); flex-shrink: 0; }

/* MISC */
.pf-muted { color: var(--text-muted); }
.pf-empty { text-align: center; padding: 50px 20px; color: var(--text-muted); }
.pf-progress-track { width: 100%; height: 8px; border-radius: 6px; background: var(--ink-3); overflow: hidden; margin: 6px 0 4px; }
.pf-progress-fill { height: 100%; background: linear-gradient(90deg, var(--teal), var(--gold-soft)); border-radius: 6px; }
textarea.pf-reflection { width: 100%; background: var(--ink-2); border: 1px solid var(--border); color: var(--text); border-radius: 9px; padding: 12px; font-family: inherit; font-size: 14px; min-height: 90px; resize: vertical; }
.pf-quote-block { display: flex; gap: 14px; padding: 22px 24px; background: var(--ink-2); border: 1px solid var(--border); border-left: 3px solid var(--gold); border-radius: 4px; box-shadow: -6px 0 20px rgba(245,161,0,0.12); }
.pf-quote-block p { font-family: 'Fraunces', serif; font-size: 17px; font-style: italic; margin: 0; color: var(--text); }
footer.pf-footer { padding: 30px 0; text-align: center; color: var(--text-muted); font-size: 12.5px; }

/* TERRAPESOS */
.pf-tp-toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 26px; }
.pf-tp-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
@media (max-width: 720px) { .pf-tp-columns { grid-template-columns: 1fr; } }
.pf-tp-col-title { font-family: 'Fraunces', serif; font-size: 17px; font-weight: 600; margin: 0 0 3px; }
.pf-tp-col-desc { font-size: 12.5px; color: var(--text-muted); margin-bottom: 14px; line-height: 1.45; }
.pf-tp-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.pf-tp-item:last-of-type { border-bottom: none; }
.pf-tp-dot { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; margin-top: 5px; }
.pf-tp-body { flex: 1; min-width: 0; }
.pf-tp-label { font-size: 14.5px; line-height: 1.35; }
.pf-tp-note { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }
.pf-tp-price { font-family: 'Fraunces', serif; font-weight: 600; font-size: 15.5px; white-space: nowrap; min-width: 56px; text-align: right; color: var(--gold-soft); }
.pf-tp-edit-input { background: var(--ink-3); border: 1px dashed var(--border); border-radius: 5px; color: var(--text); font-family: inherit; padding: 4px 7px; font-size: 13px; width: 100%; }
.pf-tp-edit-input.price { text-align: right; width: 70px; }
.pf-tp-remove { background: none; border: none; color: var(--danger); font-size: 18px; line-height: 1; padding: 2px 4px; cursor: pointer; flex-shrink: 0; }
.pf-tp-add-row { font-size: 12.5px; color: var(--gold-soft); background: none; border: 1px dashed var(--gold-soft); border-radius: 6px; padding: 7px 12px; margin-top: 10px; cursor: pointer; font-family: inherit; }
.pf-tp-legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 16px; font-size: 11.5px; color: var(--text-muted); }
.pf-tp-legend span { display: inline-flex; align-items: center; gap: 5px; }
.pf-tp-group { margin-bottom: 22px; }
.pf-tp-group:last-child { margin-bottom: 0; }
.pf-tp-group-title { font-size: 15.5px; font-weight: 600; display: flex; align-items: center; gap: 8px; margin-bottom: 2px; font-family: 'Fraunces', serif; }
.pf-tp-group-freq { font-family: 'IBM Plex Sans', sans-serif; font-weight: 400; font-size: 11.5px; color: var(--text-muted); }
.pf-tp-callout-text { font-size: 13.5px; line-height: 1.55; color: var(--text); }
.pf-quote-block.warn { border-left-color: var(--danger); background: rgba(251,113,133,0.08); }
.pf-tp-item.danger .pf-tp-price { color: var(--danger); }
.pf-tp-item.danger { border-bottom-color: rgba(251,113,133,0.2); }

/* ============================================================
   MOVIMIENTO Y FOTOGRAFÍA
   ============================================================ */

@keyframes pf-fade-up { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
@keyframes pf-fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes pf-float-a { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(18px, -26px); } }
@keyframes pf-float-b { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-22px, 20px); } }
@keyframes pf-hero-zoom { from { transform: scale(1.08); } to { transform: scale(1); } }
@keyframes pf-spin-once { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
@keyframes pf-shimmer { 0% { background-position: -200px 0; } 100% { background-position: 200px 0; } }

.pf-page-enter { animation: pf-fade-up 0.45s ease both; }

.pf-reveal { opacity: 0; transform: translateY(24px); transition: opacity .6s ease, transform .6s ease; }
.pf-reveal.pf-reveal-visible { opacity: 1; transform: translateY(0); }

.pf-hero-photo { position: relative; overflow: hidden; border-bottom: 1px solid var(--border); }
.pf-hero-photo-bg { position: absolute; inset: 0; background-size: cover; background-position: center; animation: pf-hero-zoom 8s ease-out both; }
.pf-hero-photo-overlay { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(20,21,31,0.65) 0%, rgba(20,21,31,0.88) 65%, rgba(20,21,31,1) 100%); }
.pf-hero-blob { position: absolute; border-radius: 50%; filter: blur(50px); opacity: 0.35; pointer-events: none; }
.pf-hero-blob.a { width: 260px; height: 260px; background: var(--gold-soft); top: -60px; right: 8%; animation: pf-float-a 9s ease-in-out infinite; }
.pf-hero-blob.b { width: 200px; height: 200px; background: var(--teal); bottom: -40px; left: 6%; animation: pf-float-b 11s ease-in-out infinite; }

/* HERO: micro-animaciones decorativas sobre la ilustración */
@keyframes pf-star-twinkle { 0%, 100% { opacity: 0.2; transform: translateY(0) scale(1); } 50% { opacity: 0.8; transform: translateY(-4px) scale(1.15); } }
@keyframes pf-bulb-flash { 0%, 100% { opacity: 0.2; transform: scale(0.9); } 50% { opacity: 0.65; transform: scale(1.15); } }
@keyframes pf-qmark-fade { 0%, 20%, 100% { opacity: 0; transform: translateY(4px); } 50% { opacity: 0.55; transform: translateY(0); } }
@keyframes pf-sway { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-3px) rotate(-3deg); } }
@keyframes pf-particle-drift { 0% { transform: translate(0, 0); opacity: 0; } 10% { opacity: 0.7; } 90% { opacity: 0.7; } 100% { transform: translate(70vw, -30px); opacity: 0; } }

.pf-hero-star { position: absolute; color: var(--gold-soft); pointer-events: none; animation: pf-star-twinkle 4s ease-in-out infinite; z-index: 1; }
.pf-hero-star.s1 { top: 10%; left: 8%; font-size: 15px; animation-delay: 0s; }
.pf-hero-star.s2 { top: 18%; left: 84%; font-size: 11px; animation-delay: 1.3s; color: var(--teal); }
.pf-hero-star.s3 { top: 6%; left: 58%; font-size: 10px; animation-delay: 2.1s; }
.pf-hero-glow { position: absolute; top: 12%; right: 16%; width: 60px; height: 60px; border-radius: 50%; background: radial-gradient(circle, rgba(255,201,60,0.55), transparent 70%); pointer-events: none; animation: pf-bulb-flash 3.2s ease-in-out infinite; z-index: 1; }
.pf-hero-qmark { position: absolute; font-family: 'Fraunces', serif; font-weight: 700; opacity: 0; pointer-events: none; animation: pf-qmark-fade 5s ease-in-out infinite; z-index: 1; }
.pf-hero-qmark.q1 { top: 30%; left: 14%; font-size: 20px; color: var(--teal); animation-delay: 0.5s; }
.pf-hero-qmark.q2 { top: 20%; left: 72%; font-size: 16px; color: var(--violet); animation-delay: 2.5s; }
.pf-hero-sway { position: absolute; bottom: 18%; left: 6%; font-size: 20px; opacity: 0.5; pointer-events: none; animation: pf-sway 3.6s ease-in-out infinite; z-index: 1; }
.pf-hero-particle { position: absolute; top: 65%; left: 0; width: 5px; height: 5px; border-radius: 50%; background: var(--coral); box-shadow: 0 0 8px var(--coral); pointer-events: none; animation: pf-particle-drift 16s linear infinite; z-index: 1; }
.pf-hero-content { position: relative; z-index: 1; }
.pf-hero-content > * { animation: pf-fade-up 0.7s ease both; }
.pf-hero-content .pf-eyebrow { animation-delay: .05s; }
.pf-hero-content h1 { animation-delay: .15s; }
.pf-hero-content p.pf-lede { animation-delay: .25s; }
.pf-hero-content .pf-btn-row { animation-delay: .35s; }

.pf-card-photo { position: relative; overflow: hidden; border-radius: 12px 12px 0 0; height: 130px; margin: -20px -20px 14px; }
.pf-card-photo img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .5s ease; }
.pf-card:hover .pf-card-photo img { transform: scale(1.08); }
.pf-card-photo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(20,21,31,0) 55%, rgba(20,21,31,0.55) 100%); }

.pf-card { transition: border-color .2s ease, transform .25s ease, box-shadow .25s ease; }
.pf-card:hover { box-shadow: 0 14px 34px rgba(0,0,0,0.35); }
.pf-card:active { transform: translateY(0) scale(0.99); }
.pf-card:hover { box-shadow: 0 14px 34px rgba(0,0,0,0.4), 0 0 26px rgba(255,201,60,0.14); }

.pf-btn { position: relative; overflow: hidden; }
.pf-btn-primary:hover { box-shadow: 0 6px 22px rgba(255,201,60,0.5); }

.pf-nav-link { position: relative; transition: color .2s ease, background .2s ease, transform .15s ease; }
.pf-nav-link:hover { transform: translateY(-1px); }
.pf-nav-link.active { box-shadow: 0 0 16px rgba(255,201,60,0.4); }
.pf-nav-link.active::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: -3px; height: 2px; background: var(--gold); border-radius: 2px; box-shadow: 0 0 8px var(--gold-soft); animation: pf-fade-in .3s ease; }

.pf-logo-mark { transition: transform .35s ease, box-shadow .35s ease; box-shadow: 0 0 16px rgba(255,201,60,0.4); }
.pf-logo:hover .pf-logo-mark { transform: rotate(-8deg) scale(1.06); box-shadow: 0 0 24px rgba(255,201,60,0.6); }

.pf-coin-spin:hover { animation: pf-spin-once .6s ease; }

.pf-skeleton { background: linear-gradient(90deg, var(--ink-2) 25%, var(--ink-3) 37%, var(--ink-2) 63%); background-size: 400px 100%; animation: pf-shimmer 1.4s ease-in-out infinite; }

.pf-page-banner { position: relative; height: 150px; border-radius: 14px; overflow: hidden; margin-bottom: 24px; }
.pf-page-banner img { width: 100%; height: 100%; object-fit: cover; transition: transform .6s ease; }
.pf-page-banner:hover img { transform: scale(1.04); }
.pf-page-banner::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(20,21,31,0.05) 30%, rgba(20,21,31,0.85) 100%); }

/* PRESENTACIONES (PPT convertido a HTML) */
.pf-slides-wrap { background: var(--ink-2); border: 1px solid var(--border); border-radius: 14px; padding: 28px 26px; margin: 10px 0 30px; }
.pf-slides-progress { height: 4px; background: var(--ink-3); border-radius: 4px; overflow: hidden; margin-bottom: 22px; }
.pf-slides-progress-fill { height: 100%; background: linear-gradient(90deg, var(--teal), var(--gold-soft)); transition: width .3s ease; }
.pf-slide { min-height: 220px; animation: pf-fade-in 0.3s ease; }
.pf-slide-center { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding: 30px 10px; }
.pf-slide-title-big { font-family: 'Fraunces', serif; font-size: clamp(22px, 4vw, 30px); font-weight: 600; margin: 0; }
.pf-slide-subtitle { color: var(--text-muted); font-size: 14.5px; margin: 0; }
.pf-slide-h { font-family: 'Fraunces', serif; font-size: 19px; font-weight: 600; margin: 0 0 16px; }
.pf-slide-bullets { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 10px; }
.pf-slide-bullets li { font-size: 14.5px; line-height: 1.55; color: var(--text); }
.pf-slide-quote-text { font-family: 'Fraunces', serif; font-style: italic; font-size: 18px; max-width: 560px; line-height: 1.5; }
.pf-slide-quote-author { color: var(--text-muted); font-size: 13px; }
.pf-slide-twocol { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
@media (max-width: 640px) { .pf-slide-twocol { grid-template-columns: 1fr; } }
.pf-slide-col-heading { font-weight: 600; color: var(--gold-soft); margin-bottom: 8px; font-size: 14.5px; }
.pf-slide-table { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 14px; }
.pf-slide-table-col { background: var(--ink-3); border-radius: 10px; padding: 14px; }
.pf-slide-table-heading { font-weight: 700; color: var(--gold-soft); font-size: 13px; margin-bottom: 6px; }
.pf-slide-table-col p { font-size: 13px; color: var(--text-muted); margin: 0; line-height: 1.5; }
.pf-slide-nav { display: flex; align-items: center; justify-content: center; gap: 16px; margin-top: 20px; }
.pf-slide-counter { font-size: 13px; color: var(--text-muted); min-width: 60px; text-align: center; }
.pf-slide-image { width: 100%; height: auto; border-radius: 10px; display: block; background: #000; }

/* JUEGOS: MEMORIA DE COLOR */
.pf-color-swatches { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.pf-color-swatch { width: 64px; height: 64px; border-radius: 12px; border: 2px solid var(--border); flex-shrink: 0; }
.pf-color-timerbar { width: 100%; max-width: 420px; height: 6px; background: var(--ink-3); border-radius: 4px; overflow: hidden; }
.pf-color-timerbar-fill { height: 100%; background: linear-gradient(90deg, var(--teal), var(--gold-soft)); transition: width 0.1s linear; }
.pf-color-slot { width: 46px; height: 46px; border-radius: 10px; border: 2px solid var(--border); cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: rgba(0,0,0,0.55); }
.pf-color-slot.active { border-color: var(--gold-soft); box-shadow: 0 0 0 2px rgba(255,201,60,0.35); }
.pf-color-preview { width: 100%; max-width: 220px; height: 90px; border-radius: 14px; border: 2px solid var(--border); margin: 0 auto; }
.pf-color-slider-row { display: flex; flex-direction: column; gap: 4px; width: 100%; max-width: 360px; }
.pf-color-slider-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted); }
.pf-color-slider-row input[type="range"] { -webkit-appearance: none; width: 100%; height: 10px; border-radius: 6px; outline: none; cursor: pointer; }
.pf-color-slider-row input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 2px solid var(--ink); box-shadow: 0 0 0 1px rgba(0,0,0,0.2); cursor: pointer; }
.pf-color-slider-row input[type="range"]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 2px solid var(--ink); cursor: pointer; }
.pf-color-result-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); }
.pf-color-result-swatch { width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--border); flex-shrink: 0; }

/* JUEGOS: EL JUEGO DE LA CONTRASEÑA */
.pf-pw-input { width: 100%; max-width: 480px; font-size: 16px; padding: 12px 14px; border-radius: 10px; background: var(--ink-2); border: 2px solid var(--border); color: var(--text); font-family: 'IBM Plex Sans', sans-serif; letter-spacing: 0.3px; }
.pf-pw-input:focus { outline: none; border-color: var(--gold-soft); }
.pf-pw-rules { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 8px; }
.pf-pw-rule { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: 10px; background: var(--ink-2); border: 1px solid var(--border); font-size: 13.5px; animation: pf-fade-up 0.35s ease both; }
.pf-pw-rule.ok { border-color: var(--success); background: rgba(74,222,128,0.08); }
.pf-pw-rule.fail { border-color: var(--danger); background: rgba(251,113,133,0.08); }
.pf-pw-fire-bar { width: 100%; height: 6px; background: var(--ink-3); border-radius: 4px; overflow: hidden; margin-top: 8px; }
.pf-pw-fire-fill { height: 100%; background: linear-gradient(90deg, var(--coral), var(--gold-soft)); transition: width 0.1s linear; }
.pf-pw-win { text-align: center; padding: 24px; background: linear-gradient(155deg, rgba(255,201,60,0.12), rgba(167,139,250,0.1)); border: 1px solid var(--gold-soft); border-radius: 14px; max-width: 480px; }

/* EASTER EGG: LIBRO ESCONDIDO + MINIJUEGO */
.pf-easteregg-book { position: fixed; bottom: 20px; left: 20px; width: 40px; height: 40px; border-radius: 10px; background: var(--ink-2); border: 1px solid var(--border); color: var(--text-muted); display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 60; opacity: 0.5; transition: opacity .2s ease, transform .15s ease; padding: 0; }
.pf-easteregg-book:hover { opacity: 1; transform: scale(1.08); }
.pf-easteregg-book.opening { animation: pf-easteregg-shake 0.5s ease; }
@keyframes pf-easteregg-shake { 0%, 100% { transform: rotate(0deg) scale(1); } 20% { transform: rotate(-8deg) scale(1.1); } 40% { transform: rotate(8deg) scale(1.15); } 60% { transform: rotate(-6deg) scale(1.2); } 80% { transform: rotate(6deg) scale(1.25); } }
.pf-dino-wrap { position: relative; cursor: pointer; width: 100%; max-width: 560px; }
.pf-dino-canvas { background: var(--ink-2); border: 1px solid var(--border); border-radius: 10px; max-width: 100%; width: 100%; height: auto; display: block; }
.pf-dino-overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: rgba(20,21,31,0.85); border-radius: 10px; text-align: center; padding: 16px; }

/* CALENDARIO / CUENTA REGRESIVA */
.pf-countdown-featured { background: var(--ink-2); border: 2px solid #4A5578; border-radius: 18px; padding: 30px 20px 24px; position: relative; box-shadow: 0 0 0 5px rgba(74,85,120,0.18), 0 14px 34px rgba(0,0,0,0.4); }
.pf-countdown-title-banner { display: inline-block; background: linear-gradient(135deg, #9A6B3E, #6E4726); color: #FBF3E4; padding: 8px 22px; border-radius: 8px; font-family: 'Fraunces', serif; font-weight: 600; font-size: 19px; box-shadow: 0 4px 10px rgba(0,0,0,0.35); transform: rotate(-1deg); }
.pf-countdown-units { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.pf-countdown-unit { background: var(--ink-3); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px 10px; min-width: 68px; text-align: center; }
.pf-countdown-number { font-family: 'Fraunces', serif; font-weight: 700; font-size: 26px; color: var(--text); animation: pf-fade-up 0.35s ease both; }
.pf-countdown-underline { width: 30px; height: 3px; border-radius: 3px; margin: 6px auto 6px; }
.pf-countdown-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); }
.pf-countdown-pasado { text-align: center; color: var(--text-muted); font-size: 13px; }
.pf-countdown-teaser { border: 2px solid #4A5578; border-radius: 14px; background: var(--ink-2); padding: 14px 16px; margin-bottom: 8px; max-width: 480px; box-shadow: 0 0 0 4px rgba(74,85,120,0.14); }
.pf-countdown-teaser .pf-countdown-unit { min-width: 46px; padding: 8px 10px 6px; }
.pf-countdown-teaser .pf-countdown-number { font-size: 18px; }
.pf-countdown-teaser .pf-countdown-underline { width: 22px; height: 2px; margin: 4px auto; }

/* FILA DE DÍAS (decorativa, estilo banner del calendario) */
.pf-weekday-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin: -6px 0 26px; }
.pf-weekday-chip { background: var(--ink-2); border: 1px solid var(--border); border-radius: 12px; padding: 12px 18px; display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 76px; }
.pf-weekday-label { font-family: 'Fraunces', serif; font-weight: 700; font-size: 15px; }
.pf-weekday-underline { width: 34px; height: 3px; border-radius: 3px; }
.pf-playlist-embed-wrap { border-radius: 14px; overflow: hidden; border: 1px solid var(--border); }
.pf-playlist-home-box { border: 1px solid var(--border); border-radius: 14px; background: var(--ink-2); padding: 14px 16px; margin-bottom: 8px; max-width: 480px; }

/* TABLA DE POSICIONES (PODIO) */
.pf-podium { display: flex; align-items: flex-end; justify-content: center; gap: 10px; margin: 6px 0 24px; flex-wrap: wrap; }
.pf-podium-item { background: var(--ink-2); border: 1px solid var(--border); border-radius: 12px 12px 0 0; padding: 14px 10px 10px; text-align: center; width: 108px; }
.pf-podium-item.first { padding-top: 24px; border-color: var(--gold-soft); box-shadow: 0 -4px 0 var(--gold-soft) inset, 0 0 26px rgba(255,201,60,0.3); }
.pf-podium-item.second { padding-top: 12px; }
.pf-podium-item.third { padding-top: 4px; }
.pf-podium-medal { font-size: 22px; }
.pf-podium-name { font-size: 11.5px; margin-top: 4px; line-height: 1.3; min-height: 28px; color: var(--text); }
.pf-podium-price { font-family: 'Fraunces', serif; font-weight: 700; color: var(--gold-soft); margin-top: 4px; font-size: 14px; }

/* FONDO: ÍCONOS FLOTANTES */
.pf-floating-icons { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
.pf-floating-icon { position: absolute; opacity: 0.12; animation: pf-icon-float var(--dur, 16s) ease-in-out infinite; animation-delay: var(--delay, 0s); }
@keyframes pf-icon-float { 0%, 100% { transform: translate(0, 0) rotate(0deg); } 50% { transform: translate(var(--dx, 20px), var(--dy, -20px)) rotate(var(--rot, 8deg)); } }

/* ¿QUÉ PERSONAJE DE FICCIÓN ERES HOY? */
.pf-personaje-card { text-align: center; display: flex; flex-direction: column; align-items: center; background: linear-gradient(155deg, rgba(167,139,250,0.10), rgba(255,201,60,0.08)); }
.pf-personaje-badge { width: 46px; height: 46px; border-radius: 50%; background: linear-gradient(155deg, var(--gold-soft), var(--violet)); display: flex; align-items: center; justify-content: center; animation: pf-spin-once 3s ease-in-out infinite; box-shadow: 0 0 22px rgba(167,139,250,0.5); }
.pf-personaje-result { animation: pf-fade-up 0.4s ease both; }
.pf-personaje-nombre { font-family: 'Fraunces', serif; font-size: 19px; font-weight: 600; margin-top: 6px; background: linear-gradient(155deg, var(--gold-soft), var(--violet)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.pf-personaje-rasgo { font-size: 13.5px; color: var(--text-muted); margin: 6px 0 0; }

/* SPINOZITO: asistente flotante */
.pf-spinozito-fab { position: fixed; bottom: 20px; right: 20px; width: 54px; height: 54px; border-radius: 50%; background: linear-gradient(155deg, var(--gold-soft), var(--gold)); border: none; color: var(--ink); display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 8px 24px rgba(0,0,0,0.35), 0 0 22px rgba(255,201,60,0.45); z-index: 70; transition: transform .2s ease, box-shadow .2s ease; overflow: hidden; padding: 0; }
.pf-buzon-fab { position: fixed; bottom: 86px; right: 20px; width: 48px; height: 48px; border-radius: 50%; border: none; cursor: pointer; z-index: 69; overflow: hidden; padding: 0; box-shadow: 0 8px 20px rgba(0,0,0,0.35), 0 0 18px rgba(45,212,191,0.4); transition: transform .2s ease, box-shadow .2s ease; }
.pf-buzon-fab img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pf-buzon-fab:hover { transform: scale(1.08); box-shadow: 0 8px 20px rgba(0,0,0,0.35), 0 0 26px rgba(45,212,191,0.6); }
.pf-spinozito-fab img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pf-spinozito-fab:hover { transform: scale(1.06); box-shadow: 0 8px 24px rgba(0,0,0,0.35), 0 0 32px rgba(255,201,60,0.7); }
.pf-spinozito-panel { position: fixed; bottom: 84px; right: 20px; width: 320px; max-width: calc(100vw - 32px); height: 440px; max-height: calc(100vh - 120px); background: var(--ink-2); border: 1px solid var(--border); border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.5); z-index: 70; animation: pf-fade-up 0.25s ease both; }
.pf-spinozito-header { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--border); }
.pf-spinozito-avatar { width: 36px; height: 36px; border-radius: 50%; overflow: hidden; flex-shrink: 0; }
.pf-spinozito-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pf-spinozito-name { font-family: 'Fraunces', serif; font-weight: 600; font-size: 14.5px; }
.pf-spinozito-sub { font-size: 11px; color: var(--text-muted); }
.pf-spinozito-messages { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.pf-spinozito-msg { max-width: 85%; padding: 9px 12px; border-radius: 12px; font-size: 13.5px; line-height: 1.45; }
.pf-spinozito-msg.bot { background: var(--ink-3); color: var(--text); align-self: flex-start; border-bottom-left-radius: 4px; }
.pf-spinozito-msg.user { background: var(--gold-soft); color: var(--ink); align-self: flex-end; border-bottom-right-radius: 4px; }
.pf-spinozito-action { display: block; margin-top: 8px; font-size: 12px; background: var(--ink-2); border: 1px solid var(--border); color: var(--gold-soft); padding: 6px 10px; border-radius: 8px; cursor: pointer; }
.pf-spinozito-input-row { display: flex; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--border); }
.pf-spinozito-input-row .pf-input { flex: 1; }

/* SPINOZITO: burbuja de saludo + menú rápido */
.pf-spinozito-bubble { position: fixed; bottom: 84px; right: 20px; max-width: 220px; background: var(--ink-2); border: 1px solid var(--gold-soft); color: var(--text); font-size: 12.5px; padding: 10px 14px; border-radius: 14px; border-bottom-right-radius: 4px; box-shadow: 0 8px 20px rgba(0,0,0,0.35), 0 0 16px rgba(255,201,60,0.25); z-index: 71; animation: pf-fade-up 0.25s ease both; pointer-events: none; }
.pf-spinozito-quickmenu { position: fixed; bottom: 84px; right: 20px; width: 220px; background: var(--ink-2); border: 1px solid var(--border); border-radius: 14px; padding: 10px; box-shadow: 0 14px 34px rgba(0,0,0,0.4), 0 0 20px rgba(255,201,60,0.2); z-index: 71; animation: pf-fade-up 0.2s ease both; display: flex; flex-direction: column; gap: 4px; }
.pf-spinozito-quickmenu-title { font-family: 'Fraunces', serif; font-weight: 600; font-size: 13px; padding: 4px 8px 8px; color: var(--text-muted); }
.pf-spinozito-quickmenu-item { display: flex; align-items: center; gap: 10px; background: none; border: none; color: var(--text); text-align: left; padding: 9px 8px; border-radius: 8px; font-size: 13px; cursor: pointer; font-family: inherit; }
.pf-spinozito-quickmenu-item:hover { background: var(--ink-3); }

/* JUEGOS: SNAKE */
.pf-snake-wrap { position: relative; display: inline-block; }
.pf-snake-canvas { background: var(--ink-2); border: 1px solid var(--border); border-radius: 10px; image-rendering: pixelated; max-width: 100%; height: auto; touch-action: none; display: block; }
.pf-snake-overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(20,21,31,0.85); border-radius: 10px; text-align: center; padding: 20px; }
.pf-snake-dpad { display: grid; grid-template-columns: repeat(3, 46px); grid-template-rows: repeat(3, 46px); gap: 6px; justify-items: center; align-items: center; }

/* JUEGOS: WORDLE */
.pf-wordle-grid { display: flex; flex-direction: column; gap: 6px; }
.pf-wordle-row { display: flex; gap: 6px; }
.pf-wordle-tile { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 2px solid var(--border); border-radius: 6px; font-family: 'Fraunces', serif; font-weight: 700; font-size: 19px; text-transform: uppercase; background: var(--ink-2); color: var(--text); }
.pf-wordle-tile.filled { border-color: var(--text-muted); }
.pf-wordle-tile.correct { background: var(--success); border-color: var(--success); color: var(--ink); }
.pf-wordle-tile.present { background: var(--gold-soft); border-color: var(--gold-soft); color: var(--ink); }
.pf-wordle-tile.absent { background: var(--ink-3); border-color: var(--ink-3); color: var(--text-muted); }
.pf-wordle-input-row { display: flex; gap: 10px; align-items: center; }
.pf-wordle-input-row.shake { animation: pf-shake 0.4s ease; }
@keyframes pf-shake { 10%, 90% { transform: translateX(-2px); } 20%, 80% { transform: translateX(4px); } 30%, 50%, 70% { transform: translateX(-8px); } 40%, 60% { transform: translateX(8px); } }

@keyframes pf-ticker-scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
.pf-ticker { overflow: hidden; white-space: nowrap; background: var(--ink-2); border: 1px solid var(--border); border-radius: 10px; padding: 12px 0; margin-bottom: 24px; -webkit-mask-image: linear-gradient(90deg, transparent, black 6%, black 94%, transparent); mask-image: linear-gradient(90deg, transparent, black 6%, black 94%, transparent); }
.pf-ticker-track { display: inline-flex; gap: 36px; animation: pf-ticker-scroll 34s linear infinite; }
.pf-ticker:hover .pf-ticker-track { animation-play-state: paused; }
.pf-ticker-item { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--text); }
.pf-ticker-item .pf-ticker-price { font-family: 'Fraunces', serif; font-weight: 700; color: var(--gold-soft); }
.pf-ticker-sep { color: var(--text-muted); opacity: .5; }

@media (prefers-reduced-motion: reduce) {
  .pf-page-enter, .pf-reveal, .pf-hero-content > *, .pf-hero-photo-bg, .pf-hero-blob, .pf-card-photo img, .pf-logo-mark, .pf-nav-link, .pf-ticker-track, .pf-floating-icon, .pf-hero-star, .pf-hero-glow, .pf-hero-qmark, .pf-hero-sway, .pf-hero-particle { animation: none !important; transition: none !important; }
  .pf-hero-qmark, .pf-hero-particle { display: none; }
  .pf-reveal { opacity: 1; transform: none; }
}
/* ---------- Celebración, rachas e insignias ---------- */
.pf-celebrate { position: fixed; inset: 0; z-index: 9999; pointer-events: none; overflow: hidden; display: flex; align-items: flex-start; justify-content: center; padding-top: 14vh; }
.pf-confetti-piece { position: absolute; top: -20px; border-radius: 2px; opacity: 0.95; animation-name: pf-confetti-fall; animation-timing-function: linear; animation-fill-mode: forwards; }
@keyframes pf-confetti-fall { 0% { top: -20px; opacity: 1; } 100% { top: 105vh; opacity: 0.9; margin-left: 40px; } }
.pf-celebrate-card { pointer-events: auto; background: rgba(26,28,44,0.96); border: 1px solid var(--gold-soft); border-radius: 16px; padding: 18px 28px; text-align: center; box-shadow: 0 12px 40px rgba(0,0,0,0.5); animation: pf-celebrate-pop 0.45s cubic-bezier(.2,1.4,.4,1) both; max-width: 90vw; }
@keyframes pf-celebrate-pop { 0% { transform: scale(0.5) translateY(-20px); opacity: 0; } 100% { transform: scale(1) translateY(0); opacity: 1; } }
.pf-celebrate-amount { font-family: "Fraunces", serif; font-size: 28px; font-weight: 700; color: var(--gold); }
.pf-celebrate-streak { margin-top: 6px; font-size: 15px; font-weight: 600; color: #FB923C; }
.pf-celebrate-badge { margin-top: 8px; font-size: 14px; color: var(--text); }
.pf-celebrate-badge span { font-size: 20px; margin-right: 4px; }
.pf-streak-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; width: 100%; max-width: 560px; }
.pf-streak-box { background: var(--ink-2); border: 1px solid var(--border); border-radius: 12px; padding: 12px 8px; text-align: center; }
.pf-streak-num { font-family: "Fraunces", serif; font-size: 22px; font-weight: 700; color: var(--gold); }
.pf-streak-lbl { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }
.pf-badge-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; width: 100%; max-width: 640px; }
.pf-badge { background: var(--ink-2); border: 1px solid var(--gold-soft); border-radius: 12px; padding: 12px 10px; text-align: center; }
.pf-badge.locked { opacity: 0.45; filter: grayscale(1); border-color: var(--border); }
.pf-badge-emoji { font-size: 30px; }
.pf-badge-name { font-weight: 600; font-size: 13.5px; margin-top: 4px; }
.pf-badge-desc { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }
@media (prefers-reduced-motion: reduce) { .pf-confetti-piece { display: none; } .pf-celebrate-card { animation: none; } }

/* ============ LOOK MÁS AUDAZ ============ */
@property --pf-angle { syntax: "<angle>"; initial-value: 0deg; inherits: false; }
@keyframes pf-gradient-shift { 0% { background-position: 0% 50%; } 100% { background-position: 250% 50%; } }
@keyframes pf-border-spin { to { --pf-angle: 360deg; } }
@keyframes pf-aurora-move { 0% { transform: translate3d(0,0,0) scale(1); } 50% { transform: translate3d(3%, -2%, 0) scale(1.08); } 100% { transform: translate3d(-3%, 2%, 0) scale(1); } }
@keyframes pf-shimmer { 0% { transform: translateX(-120%) skewX(-20deg); } 60%, 100% { transform: translateX(260%) skewX(-20deg); } }
@keyframes pf-rise { 0% { transform: translateY(60px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
@keyframes pf-pulse-glow { 0%, 100% { box-shadow: 0 0 18px rgba(255,201,60,0.3); } 50% { box-shadow: 0 0 40px rgba(255,201,60,0.75); } }
@keyframes pf-medal-bounce { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-5px) rotate(-6deg); } }

.pf-app::before { content: ""; position: fixed; inset: -10%; z-index: 0; pointer-events: none;
  background:
    radial-gradient(40vmax circle at 15% 20%, rgba(255,107,139,0.16), transparent 60%),
    radial-gradient(38vmax circle at 85% 15%, rgba(56,189,248,0.15), transparent 60%),
    radial-gradient(42vmax circle at 70% 85%, rgba(167,139,250,0.17), transparent 60%),
    radial-gradient(34vmax circle at 10% 90%, rgba(255,201,60,0.12), transparent 60%);
  animation: pf-aurora-move 16s ease-in-out infinite alternate; }

.pf-hero h1 { background: linear-gradient(90deg, #FFFFFF 0%, #FFC93C 22%, #FF6B8B 45%, #38BDF8 68%, #FFFFFF 90%); background-size: 250% auto; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; animation: pf-gradient-shift 9s linear infinite; filter: drop-shadow(0 3px 12px rgba(0,0,0,0.55)); }
.pf-section-head h2 { background: linear-gradient(90deg, #FFC93C, #FF6B8B 60%, #A78BFA); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; }
.pf-logo-name { background: linear-gradient(90deg, #FFFFFF, #FFC93C, #FF6B8B, #FFFFFF); background-size: 250% auto; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; animation: pf-gradient-shift 8s linear infinite; }

.pf-card:hover { border: 1px solid transparent; background: linear-gradient(var(--ink-2), var(--ink-2)) padding-box, conic-gradient(from var(--pf-angle), #FFC93C, #FF6B8B, #A78BFA, #38BDF8, #4ADE80, #FFC93C) border-box; animation: pf-border-spin 3.5s linear infinite; box-shadow: 0 14px 34px rgba(0,0,0,0.4), 0 0 30px rgba(255,107,139,0.22); }

.pf-btn-primary { position: relative; overflow: hidden; background: linear-gradient(110deg, #FFC93C, #FF9F43 45%, #FF6B8B); color: #1B1030; font-weight: 700; box-shadow: 0 0 22px rgba(255,159,67,0.45), 0 4px 14px rgba(0,0,0,0.3); }
.pf-btn-primary::after { content: ""; position: absolute; top: 0; left: 0; width: 40%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.55), transparent); animation: pf-shimmer 3.6s ease-in-out infinite; pointer-events: none; }
.pf-btn-primary:hover { box-shadow: 0 6px 30px rgba(255,107,139,0.6); transform: translateY(-1px); }
.pf-btn-secondary { border-color: rgba(255,201,60,0.6); box-shadow: 0 0 14px rgba(255,201,60,0.15); }
.pf-btn-secondary:hover { box-shadow: 0 0 24px rgba(255,201,60,0.4); }

.pf-nav { border-bottom: 1px solid transparent; border-image: linear-gradient(90deg, #FFC93C, #FF6B8B, #A78BFA, #38BDF8, #4ADE80) 1; }
.pf-nav-link.active { background: linear-gradient(110deg, #FFC93C, #FF9F43); box-shadow: 0 0 18px rgba(255,201,60,0.5); }
.pf-tab.active { border-image: linear-gradient(90deg, #FFC93C, #FF6B8B) 1; text-shadow: 0 0 14px rgba(255,201,60,0.6); }
.pf-chip { box-shadow: 0 0 10px rgba(167,139,250,0.12); }
.pf-eyebrow { text-shadow: 0 0 12px rgba(255,201,60,0.55); }
.pf-ticker { box-shadow: 0 0 24px rgba(255,201,60,0.18); border-color: rgba(255,201,60,0.4); }

/* Podio animado */
.pf-podium-item { animation: pf-rise 0.8s cubic-bezier(.2,.9,.3,1.1) both; }
.pf-podium-item.first { animation: pf-rise 0.8s cubic-bezier(.2,.9,.3,1.1) 0.5s both, pf-pulse-glow 2.4s ease-in-out 1.4s infinite; }
.pf-podium-item.second { animation-delay: 0.25s; }
.pf-podium-item.third { animation-delay: 0s; }
.pf-podium-medal { display: inline-block; animation: pf-medal-bounce 2.2s ease-in-out infinite; }
.pf-podium-item.first .pf-podium-medal { font-size: 30px; }

/* Misiones y nivel */
.pf-missions { margin-top: 14px; background: linear-gradient(160deg, rgba(167,139,250,0.14), rgba(255,107,139,0.1)); border: 1px solid rgba(167,139,250,0.45); border-radius: 14px; padding: 16px 18px; box-shadow: 0 0 26px rgba(167,139,250,0.15); }
.pf-mission-bar { height: 9px; border-radius: 6px; background: rgba(255,255,255,0.1); overflow: hidden; }
.pf-mission-bar-fill { height: 100%; border-radius: 6px; background: linear-gradient(90deg, #4ADE80, #FFC93C, #FF6B8B); transition: width .6s cubic-bezier(.2,.9,.3,1); box-shadow: 0 0 12px rgba(255,201,60,0.6); }
.pf-mission-list { display: grid; gap: 8px; margin-top: 12px; }
.pf-mission { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 10px; background: rgba(20,21,31,0.55); border: 1px solid var(--border); font-size: 14px; }
.pf-mission.done { border-color: rgba(74,222,128,0.6); background: rgba(74,222,128,0.1); text-decoration: line-through; text-decoration-color: rgba(74,222,128,0.6); color: var(--text-muted); }
.pf-mission-emoji { font-size: 18px; }
.pf-level-card { display: flex; align-items: center; gap: 14px; width: 100%; max-width: 560px; background: linear-gradient(120deg, rgba(255,201,60,0.14), rgba(255,107,139,0.12)); border: 1px solid var(--gold-soft); border-radius: 14px; padding: 14px 16px; box-shadow: 0 0 24px rgba(255,201,60,0.2); }
.pf-level-badge { width: 54px; height: 54px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: "Fraunces", serif; font-size: 26px; font-weight: 700; color: #1B1030; background: conic-gradient(#FFC93C, #FF6B8B, #A78BFA, #38BDF8, #FFC93C); box-shadow: 0 0 20px rgba(255,201,60,0.55); flex-shrink: 0; }
.pf-level-name { font-family: "Fraunces", serif; font-size: 18px; font-weight: 700; color: var(--gold-soft); }
.pf-celebrate-level { margin-top: 8px; font-size: 15px; font-weight: 700; color: #4ADE80; }
@media (prefers-reduced-motion: reduce) {
  .pf-app::before, .pf-hero h1, .pf-logo-name, .pf-card:hover, .pf-btn-primary::after, .pf-podium-item, .pf-podium-item.first, .pf-podium-medal { animation: none !important; }
}

.pf-tp-adjust { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--border); background: var(--ink-3); color: var(--text); font-size: 20px; font-weight: 700; cursor: pointer; margin-left: 6px; line-height: 1; }
.pf-tp-adjust.plus { border-color: #4ADE80; color: #4ADE80; }
.pf-tp-adjust.minus { border-color: #FB7185; color: #FB7185; }
.pf-tp-adjust:hover { background: var(--ink-2); box-shadow: 0 0 12px rgba(255,201,60,0.35); }
.pf-tp-adjust-panel { background: rgba(255,201,60,0.08); border: 1px solid var(--gold-soft); border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; }
.pf-tp-toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #262939; border: 1px solid #333650; color: #F8F6F0; padding: 12px 18px; border-radius: 10px; font-size: 14px; z-index: 9999; box-shadow: 0 8px 28px rgba(0,0,0,0.5); max-width: 92vw; }
.pf-tp-toast button { margin-left: 12px; background: none; border: none; color: #A6A8BE; cursor: pointer; }

`;

function TpEditableText({ value, onChange, tpEditing }) {
  if (!tpEditing) return <p className="pf-tp-callout-text">{value}</p>;
  return <textarea className="pf-reflection" value={value} onChange={(e) => onChange(e.target.value)} />;
}

function TpRow({ item, tier, danger, onChangeField, onRemove, tpEditing }) {
  return (
    <div className={"pf-tp-item" + (danger ? " danger" : "")}>
      {tier && <div className="pf-tp-dot" style={{ background: TERRAPESOS_TIERS[tier]?.hex || "#4ADE80" }} />}
      <div className="pf-tp-body">
        {tpEditing ? (
          <>
            <input className="pf-tp-edit-input" value={item.label} onChange={(e) => onChangeField("label", e.target.value)} />
            <input className="pf-tp-edit-input" style={{ marginTop: 5 }} placeholder="Nota (opcional)" value={item.note || ""} onChange={(e) => onChangeField("note", e.target.value)} />
          </>
        ) : (
          <>
            <div className="pf-tp-label">{item.label}</div>
            {item.note && <div className="pf-tp-note">{item.note}</div>}
          </>
        )}
      </div>
      {tpEditing ? (
        <input className="pf-tp-edit-input price" value={item.price} onChange={(e) => onChangeField("price", e.target.value)} />
      ) : (
        <div className="pf-tp-price">{item.price}</div>
      )}
      {tpEditing && <button className="pf-tp-remove" onClick={onRemove}>×</button>}
    </div>
  );
}

function TerrapesosApp() {
  const [tpData, setTpData] = useState(TERRAPESOS_DEFAULT);
  const [tpLoaded, setTpLoaded] = useState(false);
  const [tpTab, setTpTab] = useState("cambio");
  const [tpStudentSearch, setTpStudentSearch] = useState("");
  const [tpCursoSeleccionado, setTpCursoSeleccionado] = useState("3medio");
  const [tpNewCursoNombre, setTpNewCursoNombre] = useState("");
  const [tpEditing, setTpEditing] = useState(false);
  const [tpSnapshot, setTpSnapshot] = useState(null);
  const [tpAskingPin, setTpAskingPin] = useState(false);
  const [tpPinInput, setTpPinInput] = useState("");
  const [tpPinError, setTpPinError] = useState(false);

  useEffect(() => {
    (async () => {
      try {
        const res = await window.storage.get(TERRAPESOS_STORAGE_KEY, true);
        if (res && res.value) {
          const saved = JSON.parse(res.value);
          // Si hay datos guardados de una versión anterior (por ejemplo, sin la
          // sección "multas"), se completa con los valores por defecto en vez
          // de dejar propiedades faltantes que rompan el resto de la pantalla.
          const merged = { ...TERRAPESOS_DEFAULT, ...saved };
          setTpData(merged);
        }
      } catch (e) {
        // sin datos guardados todavía: se usan los valores por defecto
      } finally {
        setTpLoaded(true);
      }
    })();
  }, []);

  const tpRequestEdit = () => {
    setTpPinInput("");
    setTpPinError(false);
    setTpAskingPin(true);
  };
  const tpConfirmPin = () => {
    if (tpPinInput === TERRAPESOS_EDIT_PIN) {
      setTpAskingPin(false);
      tpStartEdit();
    } else {
      setTpPinError(true);
    }
  };
  const tpStartEdit = () => {
    setTpSnapshot(JSON.parse(JSON.stringify(tpData)));
    setTpEditing(true);
  };
  const tpCancelEdit = () => {
    setTpData(tpSnapshot);
    setTpEditing(false);
  };
  const tpSave = async () => {
    setTpEditing(false);
    try {
      const res = await window.storage.get(TERRAPESOS_STORAGE_KEY, true);
      const latest = res && res.value ? { ...TERRAPESOS_DEFAULT, ...JSON.parse(res.value) } : tpData;

      // Para los saldos de estudiantes, evitamos pisar premios ganados en
      // juegos mientras se editaba: partimos de los datos más recientes del
      // servidor y solo aplicamos los cambios que se hicieron a mano aquí.
      const mergedEstudiantesPorCurso = (latest.estudiantesPorCurso || []).map((serverCurso) => {
        const snapshotCurso = tpSnapshot?.estudiantesPorCurso?.find((c) => c.id === serverCurso.id);
        const editedCurso = tpData.estudiantesPorCurso.find((c) => c.id === serverCurso.id);
        if (!snapshotCurso || !editedCurso) return serverCurso;
        const mergedEstudiantes = serverCurso.estudiantes.map((serverEst, i) => {
          const before = snapshotCurso.estudiantes[i];
          const after = editedCurso.estudiantes[i];
          if (!before || !after) return serverEst;
          return {
            label: before.label !== after.label ? after.label : serverEst.label,
            price: before.price !== after.price ? after.price : serverEst.price,
          };
        });
        if (editedCurso.estudiantes.length > serverCurso.estudiantes.length) {
          mergedEstudiantes.push(...editedCurso.estudiantes.slice(serverCurso.estudiantes.length));
        }
        return { ...editedCurso, estudiantes: mergedEstudiantes };
      });

      const finalData = { ...tpData, estudiantesPorCurso: mergedEstudiantesPorCurso };
      await window.storage.set(TERRAPESOS_STORAGE_KEY, JSON.stringify(finalData), true);
      setTpData(finalData);
      setToast("Cambios de Terrapesos guardados ✓ (visibles para todos los estudiantes)");
    } catch (e) {
      setToast("No se pudo guardar. Intenta nuevamente.");
    }
  };
  const tpReset = async () => {
    setTpData(TERRAPESOS_DEFAULT);
    setTpEditing(false);
    try {
      await window.storage.set(TERRAPESOS_STORAGE_KEY, JSON.stringify(TERRAPESOS_DEFAULT), true);
      setToast("Valores de Terrapesos restablecidos");
    } catch (e) {}
  };

  const tpUpdateListItem = (listKey, index, field, value) => {
    setTpData((d) => {
      const next = { ...d, [listKey]: [...d[listKey]] };
      next[listKey][index] = { ...next[listKey][index], [field]: value };
      return next;
    });
  };
  const tpAddListItem = (listKey, withTier, preset) => {
    setTpData((d) => ({
      ...d,
      [listKey]: [...d[listKey], preset || (withTier ? { tier: "d1000", label: "Nuevo beneficio", note: "", price: "1.000" } : { label: "Nuevo beneficio", note: "", price: "1.000" })],
    }));
  };
  const tpRemoveListItem = (listKey, index) => {
    setTpData((d) => ({ ...d, [listKey]: d[listKey].filter((_, i) => i !== index) }));
  };

  const tpUpdateGroupItem = (groupKey, index, field, value) => {
    setTpData((d) => {
      const group = { ...d[groupKey], items: [...d[groupKey].items] };
      group.items[index] = { ...group.items[index], [field]: value };
      return { ...d, [groupKey]: group };
    });
  };
  const tpAddGroupItem = (groupKey) => {
    setTpData((d) => {
      const group = { ...d[groupKey], items: [...d[groupKey].items, { label: "Nueva actividad", note: "", price: "1.000" }] };
      return { ...d, [groupKey]: group };
    });
  };
  const tpRemoveGroupItem = (groupKey, index) => {
    setTpData((d) => {
      const group = { ...d[groupKey], items: d[groupKey].items.filter((_, i) => i !== index) };
      return { ...d, [groupKey]: group };
    });
  };

  const tpUpdateStudent = (cursoId, index, field, value) => {
    setTpData((d) => ({
      ...d,
      estudiantesPorCurso: d.estudiantesPorCurso.map((c) =>
        c.id === cursoId ? { ...c, estudiantes: c.estudiantes.map((e, i) => (i === index ? { ...e, [field]: value } : e)) } : c
      ),
    }));
  };
  const tpAddStudent = (cursoId) => {
    setTpData((d) => ({
      ...d,
      estudiantesPorCurso: d.estudiantesPorCurso.map((c) =>
        c.id === cursoId ? { ...c, estudiantes: [...c.estudiantes, { label: "Nuevo estudiante", price: "0" }] } : c
      ),
    }));
  };
  const tpRemoveStudent = (cursoId, index) => {
    setTpData((d) => ({
      ...d,
      estudiantesPorCurso: d.estudiantesPorCurso.map((c) =>
        c.id === cursoId ? { ...c, estudiantes: c.estudiantes.filter((_, i) => i !== index) } : c
      ),
    }));
  };
  const tpAddCurso = () => {
    const nombre = tpNewCursoNombre.trim();
    if (!nombre) return;
    const id = "curso-" + Date.now();
    setTpData((d) => ({ ...d, estudiantesPorCurso: [...d.estudiantesPorCurso, { id, nombre, estudiantes: [] }] }));
    setTpNewCursoNombre("");
    setTpCursoSeleccionado(id);
  };
  const tpRemoveCurso = (cursoId) => {
    setTpData((d) => ({ ...d, estudiantesPorCurso: d.estudiantesPorCurso.filter((c) => c.id !== cursoId) }));
    setTpCursoSeleccionado((sel) => (sel === cursoId ? "" : sel));
  };

  const [toast, setToast] = useState(null);
  const [tpMonto, setTpMonto] = useState("1.000");
  const [tpMotivo, setTpMotivo] = useState(() => { try { return localStorage.getItem("tp-motivo") || ""; } catch (e) { return ""; } });
  const [tpMovs, setTpMovs] = useState(null);
  const tpMontoNum = () => Math.abs(parseInt(String(tpMonto).replace(/[.\s]/g, ""), 10)) || 0;

  useEffect(() => {
    if (tpTab !== "movimientos") return;
    let vivo = true;
    (async () => {
      try {
        const res = await window.storage.get(MOVIMIENTOS_KEY, true);
        if (vivo) setTpMovs(res && res.value ? JSON.parse(res.value) : []);
      } catch (e) {
        if (vivo) setTpMovs([]);
      }
    })();
    return () => { vivo = false; };
  }, [tpTab]);
  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(() => setToast(null), 3500);
    return () => clearTimeout(t);
  }, [toast]);

  // Suma o resta terrapesos de inmediato, leyendo siempre el dato más reciente del servidor.
  const tpAjustar = async (curso, nombre, delta) => {
    if (!delta) { setToast("Escribe un monto distinto de 0."); return; }
    try {
      const res = await window.storage.get(TERRAPESOS_STORAGE_KEY, true);
      const latest = res && res.value ? { ...TERRAPESOS_DEFAULT, ...JSON.parse(res.value) } : tpData;
      let nuevoSaldo = null;
      const updated = {
        ...latest,
        estudiantesPorCurso: latest.estudiantesPorCurso.map((c) =>
          c.id === curso.id
            ? { ...c, estudiantes: c.estudiantes.map((e) => {
                if (e.label === nombre) { nuevoSaldo = addTerrapesos(e.price, delta); return { ...e, price: nuevoSaldo }; }
                return e;
              }) }
            : c
        ),
      };
      if (nuevoSaldo === null) { setToast("No se encontró al estudiante en los datos guardados."); return; }
      await window.storage.set(TERRAPESOS_STORAGE_KEY, JSON.stringify(updated), true);
      const aplicar = (d) => d && ({
        ...d,
        estudiantesPorCurso: d.estudiantesPorCurso.map((c) =>
          c.id === curso.id ? { ...c, estudiantes: c.estudiantes.map((e) => (e.label === nombre ? { ...e, price: nuevoSaldo } : e)) } : c
        ),
      });
      setTpData(aplicar);
      setTpSnapshot(aplicar);
      try {
        let lista = [];
        try {
          const r2 = await window.storage.get(MOVIMIENTOS_KEY, true);
          if (r2 && r2.value) lista = JSON.parse(r2.value);
        } catch (e2) { /* aún no existe el historial */ }
        const nuevo = [{ t: new Date().toISOString(), curso: curso.nombre, nombre, delta, motivo: tpMotivo.trim() }, ...lista].slice(0, 150);
        await window.storage.set(MOVIMIENTOS_KEY, JSON.stringify(nuevo), true);
        setTpMovs(nuevo);
      } catch (e) {}
      setToast((delta > 0 ? "+" : "") + delta.toLocaleString("es-CL") + " a " + nombre.split(" ")[0] + " → saldo " + nuevoSaldo);
    } catch (e) {
      setToast("No se pudo guardar. Intenta nuevamente.");
    }
  };

  const renderTerrapesos = () => {
    const d = tpData;

    const tickerItems = [...d.individual, ...d.grupo].filter((it) => it.label && it.price);

    return (
      <div className="pf-container pf-section" style={{ paddingTop: 44 }}>
        <div className="pf-page-banner"><img src={IMG.terrapesos} alt="" loading="lazy" /></div>

        {tickerItems.length > 0 && (
          <div className="pf-ticker">
            <div className="pf-ticker-track">
              {[...tickerItems, ...tickerItems].map((it, i) => (
                <span className="pf-ticker-item" key={i}>
                  <Coins size={13} color="#FFC93C" />
                  {it.label}
                  <span className="pf-ticker-price">{it.price}</span>
                  <span className="pf-ticker-sep">•</span>
                </span>
              ))}
            </div>
          </div>
        )}

        <div className="pf-section-head">
          <div>
            <h2>Terrapesos</h2>
            <p>Sistema de incentivos del curso · Colegio Quillota Terranova · Banco Terranova</p>
          </div>
        </div>

        <div className="pf-tp-toolbar">
          {!tpEditing ? (
            <button className="pf-btn pf-btn-secondary" onClick={tpRequestEdit}><Pencil size={15} /> Editar contenido</button>
          ) : (
            <>
              <button className="pf-btn pf-btn-primary" onClick={tpSave}><Save size={15} /> Guardar cambios</button>
              <button className="pf-btn pf-btn-secondary" onClick={tpCancelEdit}>Cancelar</button>
              <button className="pf-btn pf-btn-secondary" onClick={tpReset}>Restablecer valores originales</button>
            </>
          )}
        </div>

        <div className="pf-tabs">
          <button className={"pf-tab" + (tpTab === "cambio" ? " active" : "")} onClick={() => setTpTab("cambio")}>Casa de Cambio</button>
          <button className={"pf-tab" + (tpTab === "ganar" ? " active" : "")} onClick={() => setTpTab("ganar")}>Cómo se ganan</button>
          <button className={"pf-tab" + (tpTab === "multas" ? " active" : "")} onClick={() => setTpTab("multas")}>Multas</button>
          <button className={"pf-tab" + (tpTab === "estudiantes" ? " active" : "")} onClick={() => setTpTab("estudiantes")}>Mis Terrapesos</button>
          <button className={"pf-tab" + (tpTab === "movimientos" ? " active" : "")} onClick={() => setTpTab("movimientos")}>Movimientos</button>
        </div>

        {tpTab === "cambio" && (
          <>
            <div className="pf-tp-columns">
              <div>
                <div className="pf-tp-col-title">Beneficios individuales</div>
                <div className="pf-tp-col-desc">Se pagan con tus propios terrapesos, cuando quieras canjearlos.</div>
                {d.individual.map((item, i) => (
                  <TpRow tpEditing={tpEditing} key={i} item={item} tier={item.tier} onChangeField={(f, v) => tpUpdateListItem("individual", i, f, v)} onRemove={() => tpRemoveListItem("individual", i)} />
                ))}
                {tpEditing && <button className="pf-tp-add-row" onClick={() => tpAddListItem("individual", true)}><Plus size={13} style={{ verticalAlign: -2 }} /> Agregar beneficio</button>}
              </div>
              <div>
                <div className="pf-tp-col-title">Beneficios en grupo</div>
                <div className="pf-tp-col-desc">Se juntan entre varios estudiantes, aportando terrapesos cada uno.</div>
                {d.grupo.map((item, i) => (
                  <TpRow tpEditing={tpEditing} key={i} item={item} tier={item.tier} onChangeField={(f, v) => tpUpdateListItem("grupo", i, f, v)} onRemove={() => tpRemoveListItem("grupo", i)} />
                ))}
                {tpEditing && <button className="pf-tp-add-row" onClick={() => tpAddListItem("grupo", true)}><Plus size={13} style={{ verticalAlign: -2 }} /> Agregar beneficio</button>}
                <div className="pf-tp-legend">
                  {Object.entries(TERRAPESOS_TIERS).map(([k, v]) => (
                    <span key={k}><div className="pf-tp-dot" style={{ background: v.hex }} />{v.label}</span>
                  ))}
                </div>
              </div>
            </div>
            <div className="pf-quote-block" style={{ marginTop: 22, alignItems: "flex-start" }}>
              <Coins size={20} color="#FFC93C" style={{ flexShrink: 0, marginTop: 3 }} />
              <div style={{ flex: 1 }}>
                <div className="pf-eyebrow" style={{ marginBottom: 6 }}>Ejemplo</div>
                <TpEditableText tpEditing={tpEditing} value={d.exampleText} onChange={(v) => setTpData((s) => ({ ...s, exampleText: v }))} />
              </div>
            </div>
          </>
        )}

        {tpTab === "ganar" && (
          <>
            <div className="pf-quote-block" style={{ marginBottom: 26, alignItems: "flex-start" }}>
              <Coins size={20} color="#FFC93C" style={{ flexShrink: 0, marginTop: 3 }} />
              <div style={{ flex: 1 }}>
                <div className="pf-eyebrow" style={{ marginBottom: 6 }}>Importante</div>
                <TpEditableText tpEditing={tpEditing} value={d.importantText} onChange={(v) => setTpData((s) => ({ ...s, importantText: v }))} />
              </div>
            </div>

            {["g1", "g2", "g3", "g4"].map((gk) => {
              const group = d[gk];
              return (
                <div className="pf-tp-group" key={gk}>
                  <div className="pf-tp-group-title">
                    <div className="pf-tp-dot" style={{ background: TERRAPESOS_TIERS[group.tier]?.hex || "#4ADE80" }} />
                    {group.titulo}
                    {group.frecuencia && <span className="pf-tp-group-freq">({group.frecuencia})</span>}
                  </div>
                  {group.items.map((item, i) => (
                    <TpRow tpEditing={tpEditing} key={i} item={item} tier={null} onChangeField={(f, v) => tpUpdateGroupItem(gk, i, f, v)} onRemove={() => tpRemoveGroupItem(gk, i)} />
                  ))}
                  {tpEditing && <button className="pf-tp-add-row" onClick={() => tpAddGroupItem(gk)}><Plus size={13} style={{ verticalAlign: -2 }} /> Agregar</button>}
                </div>
              );
            })}

            <div className="pf-quote-block" style={{ marginTop: 8, alignItems: "flex-start" }}>
              <Info size={20} color="#FFC93C" style={{ flexShrink: 0, marginTop: 3 }} />
              <div style={{ flex: 1 }}>
                <div className="pf-eyebrow" style={{ marginBottom: 6 }}>Cómo funciona</div>
                <TpEditableText tpEditing={tpEditing} value={d.funcionaText} onChange={(v) => setTpData((s) => ({ ...s, funcionaText: v }))} />
              </div>
            </div>
          </>
        )}

        {tpTab === "multas" && (
          <>
            <div className="pf-quote-block warn" style={{ marginBottom: 26, alignItems: "flex-start" }}>
              <Info size={20} color="#FB7185" style={{ flexShrink: 0, marginTop: 3 }} />
              <div style={{ flex: 1 }}>
                <div className="pf-eyebrow" style={{ marginBottom: 6, color: "#FB7185" }}>Importante</div>
                <TpEditableText tpEditing={tpEditing} value={d.multasImportantText} onChange={(v) => setTpData((s) => ({ ...s, multasImportantText: v }))} />
              </div>
            </div>
            <div className="pf-tp-col-title">Multas</div>
            <div className="pf-tp-col-desc">Se descuentan de tus terrapesos acumulados cuando corresponda.</div>
            {d.multas.map((item, i) => (
              <TpRow tpEditing={tpEditing} key={i} item={item} tier={null} danger onChangeField={(f, v) => tpUpdateListItem("multas", i, f, v)} onRemove={() => tpRemoveListItem("multas", i)} />
            ))}
            {tpEditing && <button className="pf-tp-add-row" onClick={() => tpAddListItem("multas", false, { label: "Nueva multa", note: "", price: "-1.000" })}><Plus size={13} style={{ verticalAlign: -2 }} /> Agregar multa</button>}
          </>
        )}

        {tpTab === "estudiantes" && (() => {
          const parseSaldo = (s) => parseInt(String(s).replace(/[.\s]/g, ""), 10) || 0;
          const cursos = d.estudiantesPorCurso || [];
          const cursoActivo = cursos.find((c) => c.id === tpCursoSeleccionado) || cursos[0];
          const conIndice = cursoActivo ? cursoActivo.estudiantes.map((e, i) => ({ ...e, _i: i })) : [];
          const filtrados = conIndice.filter((e) => !tpStudentSearch.trim() || e.label.toLowerCase().includes(tpStudentSearch.trim().toLowerCase()));
          const ordenados = [...filtrados].sort((a, b) => parseSaldo(b.price) - parseSaldo(a.price) || a.label.localeCompare(b.label, "es"));
          const totalCirculacion = conIndice.reduce((acc, e) => acc + parseSaldo(e.price), 0);
          return (
            <>
              <div className="pf-tp-col-title">Mis Terrapesos · Tabla de posiciones</div>
              <div className="pf-tp-col-desc">Elige tu curso para ver el ranking y el saldo de cada estudiante.</div>

              <div className="pf-chip-row" style={{ marginBottom: 16 }}>
                {cursos.map((c) => (
                  <button
                    key={c.id}
                    className="pf-chip"
                    style={{
                      cursor: "pointer",
                      ...(tpCursoSeleccionado === c.id || (!tpCursoSeleccionado && c === cursos[0])
                        ? { background: "var(--gold-soft)", color: "var(--ink)", borderColor: "var(--gold-soft)", fontWeight: 600 }
                        : {}),
                    }}
                    onClick={() => setTpCursoSeleccionado(c.id)}
                  >
                    {c.nombre} ({c.estudiantes.length})
                  </button>
                ))}
              </div>

              {tpEditing && (
                <div style={{ display: "flex", gap: 8, marginBottom: 20, flexWrap: "wrap" }}>
                  <input
                    className="pf-input"
                    style={{ maxWidth: 260 }}
                    placeholder="Nombre del nuevo curso (ej: 4° Medio B)"
                    value={tpNewCursoNombre}
                    onChange={(e) => setTpNewCursoNombre(e.target.value)}
                    onKeyDown={(e) => e.key === "Enter" && tpAddCurso()}
                  />
                  <button className="pf-btn pf-btn-secondary" style={{ padding: "9px 14px", fontSize: 13 }} onClick={tpAddCurso}><Plus size={14} /> Agregar curso</button>
                  {cursoActivo && (
                    <button className="pf-btn pf-btn-secondary" style={{ padding: "9px 14px", fontSize: 13, color: "var(--danger)", borderColor: "var(--danger)" }} onClick={() => tpRemoveCurso(cursoActivo.id)}>
                      <Trash2 size={14} /> Eliminar curso "{cursoActivo.nombre}"
                    </button>
                  )}
                </div>
              )}

              {!cursoActivo ? (
                <p className="pf-muted" style={{ fontSize: 13.5 }}>No hay ningún curso creado todavía.</p>
              ) : (
                <>
                  <div className="pf-chip-row" style={{ marginBottom: 16 }}>
                    <span className="pf-chip">{conIndice.length} estudiantes</span>
                    <span className="pf-chip">{totalCirculacion.toLocaleString("es-CL")} terrapesos en circulación</span>
                  </div>

                  {!tpStudentSearch.trim() && ordenados.length > 0 && (
                    <div className="pf-podium">
                      {[1, 0, 2].map((posIdx) => {
                        const est = ordenados[posIdx];
                        if (!est) return <div key={posIdx} style={{ width: 110 }} />;
                        const cls = posIdx === 0 ? "first" : posIdx === 1 ? "second" : "third";
                        const medal = posIdx === 0 ? "🥇" : posIdx === 1 ? "🥈" : "🥉";
                        return (
                          <div className={"pf-podium-item " + cls} key={est._i}>
                            <div className="pf-podium-medal">{medal}</div>
                            <div className="pf-podium-name">{est.label}</div>
                            <div className="pf-podium-price">{est.price}</div>
                          </div>
                        );
                      })}
                    </div>
                  )}

                  {tpEditing && (
                    <div className="pf-tp-adjust-panel">
                      <div style={{ fontWeight: 600, fontSize: 13.5, marginBottom: 8 }}>⚡ Sumar o restar terrapesos</div>
                      <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                        <input className="pf-input" style={{ width: 120 }} placeholder="Monto" value={tpMonto} onChange={(ev) => setTpMonto(ev.target.value)} />
                        <input className="pf-input" style={{ flex: 1, minWidth: 180 }} placeholder="Asignatura o motivo (queda en el historial)" value={tpMotivo} onChange={(ev) => { setTpMotivo(ev.target.value); try { localStorage.setItem("tp-motivo", ev.target.value); } catch (er) {} }} />
                      </div>
                      <p className="pf-muted" style={{ fontSize: 12, margin: "8px 0 0" }}>Pulsa − o + junto a cada estudiante. Se guarda al instante y no necesitas "Guardar cambios".</p>
                    </div>
                  )}

                  <input
                    className="pf-input"
                    style={{ width: "100%", marginBottom: 14 }}
                    placeholder="Buscar mi nombre…"
                    value={tpStudentSearch}
                    onChange={(e) => setTpStudentSearch(e.target.value)}
                  />
                  {ordenados.length === 0 && <p className="pf-muted" style={{ fontSize: 13.5 }}>{conIndice.length === 0 ? "Este curso todavía no tiene estudiantes cargados." : "No se encontró ningún estudiante con ese nombre."}</p>}
                  {ordenados.map((e, idx) => (
                    <div className="pf-tp-item" key={e._i}>
                      <div className="pf-tp-body">
                        {tpEditing ? (
                          <input className="pf-tp-edit-input" value={e.label} onChange={(ev) => tpUpdateStudent(cursoActivo.id, e._i, "label", ev.target.value)} />
                        ) : (
                          <div className="pf-tp-label">
                            <span className="pf-muted" style={{ marginRight: 8, fontVariantNumeric: "tabular-nums" }}>{idx + 1}.</span>
